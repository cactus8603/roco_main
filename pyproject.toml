[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stablebridge"
version = "0.1.0"
description = "Shared, versioned correspondence evidence experiments"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "opencv-python", "h5py", "Pillow"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stablebridge = "stablebridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/stablebridge"]
pythonpath = ["src"]
