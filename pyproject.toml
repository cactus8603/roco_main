[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stablebridge"
version = "0.1.0"
description = "Frozen WAFT feature repair with offline reconstruction and optimized targets"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "opencv-python", "h5py", "Pillow"]

[project.optional-dependencies]
dev = ["pytest>=8"]
waft = ["torchvision==0.20.1", "timm==1.0.11", "einops==0.8.0"]

[project.scripts]
stablebridge = "stablebridge.cli:main"
waft-repair = "waft_repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/stablebridge", "tests/waft_repair"]
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/waft-repair/licenses" = ["third_party/feature_repair/NOTICE", "third_party/feature_repair/SLIM_LICENSE", "third_party/feature_repair/MAMBA_LICENSE", "third_party/feature_repair/WAFT_LICENSE"]

